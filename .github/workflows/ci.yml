name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - run: nix fmt -- --ci
      - run: nix develop -c govulncheck ./...
